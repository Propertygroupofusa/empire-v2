<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Earnings Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            color: white;
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-subtitle {
            font-size: 13px;
            opacity: 0.8;
        }
        .full-width {
            grid-column: 1 / -1;
        }
        .status {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
        }
        .status.active {
            background: #f0fdf4;
            border-left-color: #22c55e;
            color: #166534;
        }
        .last-update {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .earnings-chart {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .chart-title {
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .bar {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .bar-label {
            min-width: 80px;
            font-size: 13px;
            color: #666;
        }
        .bar-container {
            flex: 1;
            background: #f0f4ff;
            border-radius: 4px;
            height: 24px;
            margin: 0 10px;
            overflow: hidden;
        }
        .bar-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .bar-value {
            min-width: 60px;
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Bot Earnings Dashboard</h1>

        <div class="status active" id="status">
            ✅ Bot is running and claiming jobs automatically
        </div>

        <div id="content" class="loading">
            <div class="spinner"></div>
            <p>Loading earnings data...</p>
        </div>
    </div>

    <script>
        async function fetchBotEarnings() {
            try {
                const response = await fetch('https://pgusa-platform-production.up.railway.app/payments/bot/earnings');
                const data = await response.json();
                displayEarnings(data);
            } catch (error) {
                console.error('Error fetching earnings:', error);
                document.getElementById('content').innerHTML = `
                    <div class="status">
                        ⚠️ Could not connect to pgusa-platform API
                    </div>
                `;
            }
        }

        function displayEarnings(data) {
            const earnings = data.bot_earnings || 0;
            const jobs = data.jobs_completed || 0;
            const volume = data.total_volume || 0;
            const lastUpdate = data.last_updated;

            const html = `
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">Total Earnings</div>
                        <div class="stat-value">$${earnings.toFixed(2)}</div>
                        <div class="stat-subtitle">Bot worker payout</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Jobs Completed</div>
                        <div class="stat-value">${jobs}</div>
                        <div class="stat-subtitle">Auto-claimed & completed</div>
                    </div>
                    <div class="stat-card full-width">
                        <div class="stat-label">Platform Volume</div>
                        <div class="stat-value">$${volume.toFixed(2)}</div>
                        <div class="stat-subtitle">Total client invoiced</div>
                    </div>
                </div>

                <div class="earnings-chart">
                    <div class="chart-title">Earnings Breakdown</div>
                    <div class="bar">
                        <div class="bar-label">Bot Earnings</div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${(earnings / volume * 100) || 0}%"></div>
                        </div>
                        <div class="bar-value">$${earnings.toFixed(2)}</div>
                    </div>
                    <div class="bar">
                        <div class="bar-label">Platform Take</div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${((volume - earnings) / volume * 100) || 0}%"></div>
                        </div>
                        <div class="bar-value">$${(volume - earnings).toFixed(2)}</div>
                    </div>
                </div>

                <div class="last-update">
                    Last updated: ${new Date(lastUpdate).toLocaleString()}
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        // Fetch on load
        fetchBotEarnings();

        // Refresh every 10 seconds
        setInterval(fetchBotEarnings, 10000);
    </script>
</body>
</html>
