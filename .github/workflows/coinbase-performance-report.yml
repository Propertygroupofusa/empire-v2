name: Coinbase performance report (on-demand)

# Read-only check against the real Coinbase account - USD balance, closed
# round-trips, win rate, profit factor. Same reasoning as
# live-performance-report.yml (the Alpaca version): measures actual
# execution, not a simulation. Places no orders.
on:
  workflow_dispatch:
    inputs:
      report_days:
        description: "How many days back to pull (use 1 for 'just today')"
        required: false
        default: "1"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull live performance from Coinbase account history
        env:
          COINBASE_API_KEY_NAME: ${{ secrets.COINBASE_API_KEY_NAME }}
          COINBASE_API_PRIVATE_KEY: ${{ secrets.COINBASE_API_PRIVATE_KEY }}
          REPORT_DAYS: ${{ github.event.inputs.report_days }}
        run: python scripts/coinbase_live_performance_report.py
