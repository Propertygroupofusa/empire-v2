name: One-off backtest (throwaway)

on:
  push:
    branches: ["fix/crypto-coinbase-fee-aware-profit-target"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (bot module needs these to import)
        run: pip install -r requirements.txt

      - name: 1.8% / 5%
        env:
          CRYPTO_PROFIT_TARGET_PCT: "0.018"
          CRYPTO_STOP_LOSS_PCT: "0.05"
        run: python scripts/backtest_fee_aware_target.py

      - name: 1.8% / 6%
        env:
          CRYPTO_PROFIT_TARGET_PCT: "0.018"
          CRYPTO_STOP_LOSS_PCT: "0.06"
        run: python scripts/backtest_fee_aware_target.py

      - name: 1.8% / 8%
        env:
          CRYPTO_PROFIT_TARGET_PCT: "0.018"
          CRYPTO_STOP_LOSS_PCT: "0.08"
        run: python scripts/backtest_fee_aware_target.py

      - name: 1.8% / 10%
        env:
          CRYPTO_PROFIT_TARGET_PCT: "0.018"
          CRYPTO_STOP_LOSS_PCT: "0.10"
        run: python scripts/backtest_fee_aware_target.py
