name: One-off backtest (throwaway)

on:
  push:
    branches: ["fix/crypto-coinbase-fee-aware-profit-target"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (bot module needs these to import)
        run: pip install -r requirements.txt

      - name: Verify fee-aware profit target against real data
        run: python scripts/backtest_fee_aware_target.py

      - name: Same test with a wider target / tighter stop (3% / 1%)
        env:
          CRYPTO_PROFIT_TARGET_PCT: "0.03"
          CRYPTO_STOP_LOSS_PCT: "0.01"
        run: python scripts/backtest_fee_aware_target.py

      - name: Same test with an even wider target / tighter stop (4% / 0.75%)
        env:
          CRYPTO_PROFIT_TARGET_PCT: "0.04"
          CRYPTO_STOP_LOSS_PCT: "0.0075"
        run: python scripts/backtest_fee_aware_target.py
