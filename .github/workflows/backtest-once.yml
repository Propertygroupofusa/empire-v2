name: One-off backtest (throwaway)

on:
  push:
    branches: ["fix/crypto-coinbase-fee-aware-profit-target"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (bot module needs these to import)
        run: pip install -r requirements.txt

      - name: Baseline (2% / 2%)
        run: python scripts/backtest_fee_aware_target.py

      - name: Tighter target / wider stop (1.5% / 3%)
        env:
          CRYPTO_PROFIT_TARGET_PCT: "0.015"
          CRYPTO_STOP_LOSS_PCT: "0.03"
        run: python scripts/backtest_fee_aware_target.py

      - name: Tighter target / much wider stop (1.5% / 4%)
        env:
          CRYPTO_PROFIT_TARGET_PCT: "0.015"
          CRYPTO_STOP_LOSS_PCT: "0.04"
        run: python scripts/backtest_fee_aware_target.py

      - name: Minimum viable target / wider stop (1.8% / 3%)
        env:
          CRYPTO_PROFIT_TARGET_PCT: "0.018"
          CRYPTO_STOP_LOSS_PCT: "0.03"
        run: python scripts/backtest_fee_aware_target.py
