name: One-off backtest (throwaway)

on:
  push:
    branches: ["chore/backtest-dtr-sweep-throwaway"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run DTR-sweep vs RSI backtest (with fees)
        run: python scripts/backtest_dtr_sweep.py
