name: Live performance report (on-demand)

# Read-only check against the real live Alpaca account - equity, closed
# trades, win rate, profit factor, realized slippage. See
# scripts/live_performance_report.py for why this exists instead of a
# backtest: this measures actual execution, not a simulation. Places no
# orders. Trigger manually from the Actions tab ("Run workflow") or via
# the GitHub API whenever you want a real answer instead of a guess.
on:
  workflow_dispatch:
    inputs:
      report_days:
        description: "How many days back to pull (use 1 for 'just today')"
        required: false
        default: "1"
      base_url:
        description: "Which Alpaca account to read"
        required: false
        default: "https://api.alpaca.markets"
        type: choice
        options:
          - "https://api.alpaca.markets"
          - "https://paper-api.alpaca.markets"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull live performance from Alpaca account history
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # A key pair authenticates against exactly one of these; the other
          # returns 401. Selectable rather than hardcoded because a 401 here
          # does not distinguish "revoked key" from "paper key pointed at
          # live", and guessing between those two wastes a round trip each
          # time. The report is read-only against either.
          ALPACA_BASE_URL: ${{ github.event.inputs.base_url }}
          REPORT_DAYS: ${{ github.event.inputs.report_days }}
        run: python scripts/live_performance_report.py
