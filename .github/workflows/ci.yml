name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  syntax-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This step alone would have caught the python-binance==1.20.1 pin
      # (a version that was never published) - it broke the Railway build
      # for the entire app, not just the one optional bot that used it,
      # and nothing here would have caught it before it shipped.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Catches real syntax errors in any bot/router before they reach
      # main - a broken file with a guarded import in main.py wouldn't
      # crash the app at runtime, but would silently disable whatever
      # that file provides. This surfaces it as a build failure instead.
      - name: Compile-check every Python file
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 \
            | xargs -0 -n1 python -m py_compile

      # Smoke check that the actual FastAPI app object loads cleanly -
      # this is the same command documented in
      # .claude/skills/run-empire-v2/SKILL.md's Build section.
      - name: Import FastAPI app
        run: python -c "from main import app; print('FastAPI app loaded OK')"

      # THE SUITE ITSELF. Until now CI compile-checked 639 files and ran
      # none of the 356 test modules - a test could be red for weeks and
      # nothing said so.
      #
      # It cannot simply fail on red: 19 modules fail on a clean checkout of
      # main (network-dependent, environment-dependent, or genuinely broken
      # and not yet fixed). With no recorded list "the suite is red" is true
      # every run and therefore means nothing, and a real regression hides
      # among the 19. run_tests.sh compares against the checked-in
      # test_baseline.txt and exits non-zero ONLY on a module that was
      # passing and now is not.
      #
      # Fixing one of the 19 is reported, not failed - then
      # `./run_tests.sh --update` records the better state.
      - name: Test suite against the recorded baseline
        run: ./run_tests.sh
