name: BTC compounding bot performance report (on-demand)

# Read-only check against the real Coinbase account - USD balance, closed
# BTC-USD round-trips, win rate, profit factor, and real pace (avg time per
# round-trip, avg return per round-trip). Same reasoning as
# coinbase-performance-report.yml: measures actual execution, not a guess.
# Places no orders.
on:
  workflow_dispatch:
    inputs:
      report_days:
        description: "How many days back to pull (use 7 for 'the last week')"
        required: false
        default: "7"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull real BTC compounding bot performance from Coinbase account history
        env:
          COINBASE_API_KEY_NAME: ${{ secrets.COINBASE_API_KEY_NAME }}
          COINBASE_API_PRIVATE_KEY: ${{ secrets.COINBASE_API_PRIVATE_KEY }}
          REPORT_DAYS: ${{ github.event.inputs.report_days }}
        run: python scripts/btc_compound_performance_report.py
