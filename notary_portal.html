<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 Notary Partner Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        padding: 16px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #334155; }
    .header h1 { font-size: 1.6em; margin-bottom: 6px; }
    .header p { color: #94a3b8; font-size: 0.9em; }
    .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 16px;
    }
    .card h2 { font-size: 1.1em; margin-bottom: 14px; color: #38bdf8; }
    label { display: block; font-size: 0.85em; color: #94a3b8; margin: 10px 0 4px; }
    input[type=text], input[type=email], input[type=password], input[type=tel],
    input[type=date], input[type=datetime-local], textarea, select {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        font-size: 1em;
    }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
    .checkbox-row input { width: auto; }
    button {
        margin-top: 14px;
        padding: 11px 18px;
        border: none;
        border-radius: 6px;
        background: #38bdf8;
        color: #0f172a;
        font-weight: 600;
        font-size: 0.95em;
        cursor: pointer;
    }
    button:hover { background: #0ea5e9; }
    button.secondary { background: #334155; color: #e2e8f0; }
    button.secondary:hover { background: #475569; }
    button.danger { background: #ef4444; color: #fff; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
        flex: 1; margin-top: 0; padding: 10px; background: #1e293b; color: #94a3b8;
        border: 1px solid #334155; border-radius: 6px;
    }
    .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
    .msg { margin-top: 10px; font-size: 0.9em; padding: 8px 10px; border-radius: 6px; display: none; }
    .msg.error { background: #7f1d1d; color: #fecaca; display: block; }
    .msg.success { background: #14532d; color: #bbf7d0; display: block; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.78em; font-weight: 600; }
    .badge.requested { background: #78350f; color: #fed7aa; }
    .badge.matched { background: #1e3a8a; color: #bfdbfe; }
    .badge.scheduled { background: #713f12; color: #fde68a; }
    .badge.completed { background: #14532d; color: #bbf7d0; }
    .badge.cancelled { background: #450a0a; color: #fca5a5; }
    .badge.verified { background: #14532d; color: #bbf7d0; }
    .badge.pending { background: #78350f; color: #fed7aa; }
    .badge.owed { background: #78350f; color: #fed7aa; }
    .badge.paid { background: #14532d; color: #bbf7d0; }
    .job {
        border: 1px solid #334155; border-radius: 8px; padding: 14px; margin-bottom: 10px;
    }
    .job .job-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .row2 { display: flex; gap: 10px; }
    .row2 > div { flex: 1; }
    .hidden { display: none !important; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .top-bar span { color: #94a3b8; font-size: 0.9em; }
    .muted { color: #94a3b8; font-size: 0.85em; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 Notary Partner Portal</h1>
        <p>Register, submit your credentials, and manage the jobs matched to you.</p>
    </div>

    <div id="authSection">
        <div class="tabs">
            <button class="tab-btn active" id="tabLoginBtn" onclick="showTab('login')">Log In</button>
            <button class="tab-btn" id="tabRegisterBtn" onclick="showTab('register')">Register</button>
        </div>

        <div class="card" id="loginCard">
            <h2>Log In</h2>
            <label>Email</label>
            <input type="email" id="loginEmail">
            <label>Password</label>
            <input type="password" id="loginPassword">
            <button onclick="login()">Log In</button>
            <div class="msg" id="loginMsg"></div>
        </div>

        <div class="card hidden" id="registerCard">
            <h2>Register as a Notary Partner</h2>
            <label>Full Name</label>
            <input type="text" id="regName">
            <label>Email</label>
            <input type="email" id="regEmail">
            <label>Phone</label>
            <input type="tel" id="regPhone">
            <label>Password</label>
            <input type="password" id="regPassword">
            <button onclick="register()">Create Account</button>
            <div class="msg" id="registerMsg"></div>
        </div>
    </div>

    <div id="appSection" class="hidden">
        <div class="top-bar">
            <span id="whoami"></span>
            <button class="secondary" onclick="logout()">Log Out</button>
        </div>

        <div class="card">
            <h2>Your Profile</h2>
            <div id="profileBox">Loading...</div>
        </div>

        <div class="card" id="credentialsCard">
            <h2>Notary Credentials</h2>
            <div id="credentialsStatus" class="muted" style="margin-bottom: 10px;">Loading...</div>
            <div id="credentialsForm">
                <div class="row2">
                    <div>
                        <label>Commission Number</label>
                        <input type="text" id="credCommissionNumber">
                    </div>
                    <div>
                        <label>Commission State</label>
                        <input type="text" id="credCommissionState" maxlength="2" placeholder="e.g. TX">
                    </div>
                </div>
                <label>Commission Expires</label>
                <input type="date" id="credCommissionExpires">
                <div class="checkbox-row">
                    <input type="checkbox" id="credRonAuthorized">
                    <label style="margin:0;">Authorized for Remote Online Notarization (RON)</label>
                </div>
                <label>RON Authorization State (if applicable)</label>
                <input type="text" id="credRonState" maxlength="2">
                <label>W9 Legal Name</label>
                <input type="text" id="credW9Name">
                <div class="row2">
                    <div>
                        <label>Tax Classification</label>
                        <input type="text" id="credW9Class" placeholder="e.g. Individual/Sole Proprietor">
                    </div>
                    <div>
                        <label>TIN (last 4 only)</label>
                        <input type="text" id="credW9Tin4" maxlength="4">
                    </div>
                </div>
                <label>Address</label>
                <textarea id="credW9Address" rows="2"></textarea>
                <button onclick="submitCredentials()">Submit Credentials</button>
                <div class="msg" id="credentialsMsg"></div>
            </div>
        </div>

        <div class="card">
            <h2>My Jobs</h2>
            <div id="jobsList">Loading...</div>
        </div>

        <div class="card">
            <h2>💰 Earnings</h2>
            <div id="earningsSummary" class="muted" style="margin-bottom: 10px;">Loading...</div>
            <div id="earningsList">Loading...</div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'https://empire-v2-production.up.railway.app';
    let token = localStorage.getItem('notary_worker_token') || '';
    let currentWorker = null;

    function showTab(which) {
        document.getElementById('loginCard').classList.toggle('hidden', which !== 'login');
        document.getElementById('registerCard').classList.toggle('hidden', which !== 'register');
        document.getElementById('tabLoginBtn').classList.toggle('active', which === 'login');
        document.getElementById('tabRegisterBtn').classList.toggle('active', which === 'register');
    }

    function showMsg(id, text, isError) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = 'msg ' + (isError ? 'error' : 'success');
    }

    async function apiFetch(path, options = {}) {
        const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch(API_BASE + path, Object.assign({}, options, { headers }));
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
            if (res.status === 401) {
                localStorage.removeItem('notary_worker_token');
                token = '';
                showAuthSection();
            }
            throw new Error(body.detail || ('Request failed: ' + res.status));
        }
        return body;
    }

    async function register() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;
        if (!name || !email || !password) {
            showMsg('registerMsg', 'Name, email, and password are required.', true);
            return;
        }
        try {
            await apiFetch('/workers/register', {
                method: 'POST',
                body: JSON.stringify({ name, email, phone: phone || null, password }),
            });
            showMsg('registerMsg', 'Account created! Switch to "Log In" to continue.', false);
        } catch (e) {
            showMsg('registerMsg', e.message, true);
        }
    }

    async function login() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        try {
            const data = await apiFetch('/workers/login', {
                method: 'POST',
                body: JSON.stringify({ email, password }),
            });
            token = data.access_token;
            localStorage.setItem('notary_worker_token', token);
            showMsg('loginMsg', '', false);
            document.getElementById('loginMsg').className = 'msg';
            await showAppSection();
        } catch (e) {
            showMsg('loginMsg', e.message, true);
        }
    }

    function logout() {
        localStorage.removeItem('notary_worker_token');
        token = '';
        currentWorker = null;
        showAuthSection();
    }

    function showAuthSection() {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
    }

    async function showAppSection() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        await loadProfile();
        await loadJobs();
        await loadEarnings();
    }

    async function loadProfile() {
        try {
            currentWorker = await apiFetch('/workers/me');
        } catch (e) {
            document.getElementById('profileBox').textContent = '❌ ' + e.message;
            return;
        }
        document.getElementById('whoami').textContent = currentWorker.name + ' (' + currentWorker.email + ')';
        document.getElementById('profileBox').innerHTML =
            '<div><strong>Name:</strong> ' + currentWorker.name + '</div>' +
            '<div><strong>Email:</strong> ' + currentWorker.email + '</div>' +
            '<div><strong>Phone:</strong> ' + (currentWorker.phone || '—') + '</div>' +
            '<div><strong>Status:</strong> ' + currentWorker.status + '</div>';

        const statusEl = document.getElementById('credentialsStatus');
        const formEl = document.getElementById('credentialsForm');
        if (currentWorker.credentials_verified) {
            statusEl.innerHTML = '<span class="badge verified">✅ Verified</span> — you are eligible for job matching.';
            formEl.classList.add('hidden');
        } else if (currentWorker.credentials_submitted) {
            statusEl.innerHTML = '<span class="badge pending">⏳ Submitted</span> — awaiting admin verification before you can be matched to jobs. You can resubmit below if anything needs correcting.';
            prefillCredentials(currentWorker);
        } else {
            statusEl.textContent = 'Submit your notary credentials below to become eligible for job matching.';
        }
    }

    function prefillCredentials(w) {
        document.getElementById('credCommissionNumber').value = w.notary_commission_number || '';
        document.getElementById('credCommissionState').value = w.notary_commission_state || '';
        document.getElementById('credCommissionExpires').value = w.notary_commission_expires || '';
        document.getElementById('credRonAuthorized').checked = !!w.ron_authorized;
        document.getElementById('credRonState').value = w.ron_authorization_state || '';
        document.getElementById('credW9Name').value = w.w9_legal_name || '';
        document.getElementById('credW9Class').value = w.w9_tax_classification || '';
        document.getElementById('credW9Tin4').value = w.w9_tin_last4 || '';
    }

    async function submitCredentials() {
        const payload = {
            notary_commission_number: document.getElementById('credCommissionNumber').value.trim() || null,
            notary_commission_state: document.getElementById('credCommissionState').value.trim().toUpperCase() || null,
            notary_commission_expires: document.getElementById('credCommissionExpires').value || null,
            ron_authorized: document.getElementById('credRonAuthorized').checked,
            ron_authorization_state: document.getElementById('credRonState').value.trim().toUpperCase() || null,
            w9_legal_name: document.getElementById('credW9Name').value.trim() || null,
            w9_tax_classification: document.getElementById('credW9Class').value.trim() || null,
            w9_tin_last4: document.getElementById('credW9Tin4').value.trim() || null,
            w9_address: document.getElementById('credW9Address').value.trim() || null,
        };
        try {
            currentWorker = await apiFetch('/workers/me/credentials', { method: 'POST', body: JSON.stringify(payload) });
            showMsg('credentialsMsg', 'Credentials submitted — awaiting verification.', false);
            await loadProfile();
        } catch (e) {
            showMsg('credentialsMsg', e.message, true);
        }
    }

    function jobActionsHtml(job) {
        if (job.status === 'matched') {
            return (
                '<div class="row2" style="margin-top:8px;">' +
                    '<div><label>Start</label><input type="datetime-local" id="sched-start-' + job.id + '"></div>' +
                    '<div><label>End (optional)</label><input type="datetime-local" id="sched-end-' + job.id + '"></div>' +
                '</div>' +
                '<label>Meeting Link (optional)</label>' +
                '<input type="text" id="sched-link-' + job.id + '" placeholder="https://...">' +
                '<button onclick="scheduleJob(' + job.id + ')">Schedule</button>'
            );
        }
        if (job.status === 'scheduled') {
            return '<button onclick="completeJob(' + job.id + ')">Mark Completed</button>';
        }
        return '';
    }

    async function loadJobs() {
        let data;
        try {
            data = await apiFetch('/workers/me/jobs');
        } catch (e) {
            document.getElementById('jobsList').textContent = '❌ ' + e.message;
            return;
        }
        const jobs = data.jobs || [];
        const listEl = document.getElementById('jobsList');
        if (jobs.length === 0) {
            listEl.innerHTML = '<p class="muted">No jobs matched to you yet. Once your credentials are verified, new notarization requests in your state will be matched here automatically.</p>';
            return;
        }
        listEl.innerHTML = jobs.map(job => (
            '<div class="job">' +
                '<div class="job-top">' +
                    '<strong>' + (job.job_type || 'job') + ' — ' + job.state + '</strong>' +
                    '<span class="badge ' + job.status + '">' + job.status + '</span>' +
                '</div>' +
                (job.description ? '<div class="muted">' + job.description + '</div>' : '') +
                jobActionsHtml(job) +
                '<div class="msg" id="job-msg-' + job.id + '"></div>' +
            '</div>'
        )).join('');
    }

    async function scheduleJob(jobId) {
        const start = document.getElementById('sched-start-' + jobId).value;
        const end = document.getElementById('sched-end-' + jobId).value;
        const link = document.getElementById('sched-link-' + jobId).value.trim();
        if (!start) {
            showMsg('job-msg-' + jobId, 'Start time is required.', true);
            return;
        }
        try {
            await apiFetch('/workers/me/jobs/' + jobId + '/schedule', {
                method: 'POST',
                body: JSON.stringify({
                    scheduled_start: new Date(start).toISOString(),
                    scheduled_end: end ? new Date(end).toISOString() : null,
                    meeting_link: link || null,
                }),
            });
            await loadJobs();
        } catch (e) {
            showMsg('job-msg-' + jobId, e.message, true);
        }
    }

    async function completeJob(jobId) {
        try {
            await apiFetch('/workers/me/jobs/' + jobId + '/complete', { method: 'POST' });
            await loadJobs();
            await loadEarnings();
        } catch (e) {
            showMsg('job-msg-' + jobId, e.message, true);
        }
    }

    async function loadEarnings() {
        let data;
        try {
            data = await apiFetch('/workers/me/earnings');
        } catch (e) {
            document.getElementById('earningsList').textContent = '❌ ' + e.message;
            return;
        }
        const t = data.totals || {};
        document.getElementById('earningsSummary').innerHTML =
            '<strong>Owed:</strong> $' + (t.owed || 0).toFixed(2) +
            ' | <strong>Requested:</strong> $' + (t.requested || 0).toFixed(2) +
            ' | <strong>Paid out:</strong> $' + (t.paid || 0).toFixed(2);

        const payouts = data.payouts || [];
        const listEl = document.getElementById('earningsList');
        if (payouts.length === 0) {
            listEl.innerHTML = '<p class="muted">No earnings yet - completing a paid job creates a payout here.</p>';
            return;
        }
        listEl.innerHTML = payouts.map(p => (
            '<div class="job">' +
                '<div class="job-top">' +
                    '<strong>Job #' + p.job_id + ' — $' + p.amount.toFixed(2) + '</strong>' +
                    '<span class="badge ' + p.status + '">' + p.status + '</span>' +
                '</div>' +
                (p.status === 'owed' ? '<button onclick="requestPayout(' + p.id + ')">Request Payout</button>' : '') +
                '<div class="msg" id="payout-msg-' + p.id + '"></div>' +
            '</div>'
        )).join('');
    }

    async function requestPayout(payoutId) {
        try {
            await apiFetch('/workers/me/payouts/' + payoutId + '/request', { method: 'POST' });
            await loadEarnings();
        } catch (e) {
            showMsg('payout-msg-' + payoutId, e.message, true);
        }
    }

    if (token) {
        showAppSection().catch(() => showAuthSection());
    } else {
        showAuthSection();
    }
</script>
</body>
</html>
